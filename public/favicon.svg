<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="30%" stop-color="#DFAC37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#091b36"/>
    </linearGradient>

    <linearGradient id="innerWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Text Paths -->
    <!-- Top Arc for INDIAN RAILWAYS -->
    <path id="topArc" d="M 68,256 A 188,188 0 0,1 444,256" fill="none"/>
    <!-- Bottom Arc for ACT APPRENTICE CELL KATIHAR -->
    <path id="bottomArc" d="M 444,256 A 188,188 0 0,1 68,256" fill="none"/>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Golden Border -->
  <circle cx="256" cy="256" r="250" fill="url(#goldGrad)" />
  <circle cx="256" cy="256" r="242" fill="#091b36" />
  
  <!-- Outer Ring with Cog Teeth (Indian Railway Wheel Emblem Motif) -->
  <g fill="url(#goldGrad)">
    <rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(0 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(15 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(30 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(45 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(60 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(75 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(90 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(105 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(120 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(135 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(150 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(165 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(180 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(195 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(210 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(225 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(240 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(255 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(270 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(285 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(300 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(315 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(330 256 256)"/><rect x="250" y="8" width="12" height="14" rx="2" transform="rotate(345 256 256)"/>
  </g>

  <!-- Inner Golden Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#goldGrad)" />
  <!-- Main Blue Ring for Circular Text -->
  <circle cx="256" cy="256" r="230" fill="url(#blueGrad)" />

  <!-- Circular Texts -->
  <!-- Top: INDIAN RAILWAYS • N.F. RAILWAY -->
  <text fill="url(#goldGrad)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="25" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      ★ INDIAN RAILWAYS • N.F. RAILWAY ★
    </textPath>
  </text>

  <!-- Bottom: ACT APPRENTICE CELL • KATIHAR -->
  <text fill="url(#goldGrad)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ★ ACT APPRENTICE CELL • KATIHAR ★
    </textPath>
  </text>

  <!-- Inner Golden Border -->
  <circle cx="256" cy="256" r="148" fill="url(#goldGrad)" />
  <circle cx="256" cy="256" r="142" fill="#0f2b5c" />
  <!-- Inner White / Off-White Disc -->
  <circle cx="256" cy="256" r="136" fill="url(#innerWhiteGrad)" filter="url(#shadow)" />

  <!-- Center Emblem Graphic: Ashoka Lion Capital / Train Engine & Cog Wheel -->
  <!-- Decorative Tricolour Arc at Top of Inner Circle -->
  <path d="M 160,180 A 110,110 0 0,1 352,180" fill="none" stroke="#FF9933" stroke-width="6" stroke-linecap="round"/>
  <path d="M 165,190 A 100,100 0 0,1 347,190" fill="none" stroke="#138808" stroke-width="6" stroke-linecap="round"/>

  <!-- Ashoka Chakra 24-spoke wheel behind train -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="12" fill="#1e3a8a" fill-opacity="0.2"/>

  <!-- Indian Railway Steam / Electric Locomotive Graphic (Iconic Symbol) -->
  <g transform="translate(156, 170)">
    <!-- Boiler / Engine Body -->
    <path d="M 25,120 L 35,65 Q 40,40 100,40 Q 160,40 165,65 L 175,120 Z" fill="#0f2b5c"/>
    <path d="M 38,65 Q 40,48 100,48 Q 160,48 162,65 L 170,115 L 30,115 Z" fill="#1e40af"/>

    <!-- Cab / Window Area -->
    <rect x="55" y="55" width="38" height="26" rx="4" fill="#60a5fa" stroke="#091b36" stroke-width="2.5"/>
    <rect x="107" y="55" width="38" height="26" rx="4" fill="#60a5fa" stroke="#091b36" stroke-width="2.5"/>

    <!-- Front Headlight / Red Railway Star Badge -->
    <circle cx="100" cy="98" r="20" fill="url(#goldGrad)" stroke="#091b36" stroke-width="2"/>
    <circle cx="100" cy="98" r="15" fill="url(#redGrad)"/>
    <!-- Star inside headlight -->
    <path d="M 100,86 L 103,94 L 112,94 L 105,99 L 108,107 L 100,102 L 92,107 L 95,99 L 88,94 L 97,94 Z" fill="#ffffff"/>

    <!-- Buffer Beam (Red Bottom Bar) -->
    <rect x="15" y="120" width="170" height="18" rx="4" fill="url(#redGrad)" stroke="#091b36" stroke-width="2"/>
    <!-- Buffers -->
    <rect x="25" y="138" width="22" height="8" rx="2" fill="#334155"/>
    <circle cx="36" cy="148" r="10" fill="#0f172a"/>
    <rect x="153" y="138" width="22" height="8" rx="2" fill="#334155"/>
    <circle cx="164" cy="148" r="10" fill="#0f172a"/>
    <!-- Center Coupler -->
    <rect x="90" y="138" width="20" height="12" rx="3" fill="#0f172a"/>

    <!-- Cowcatcher / Cattle Guard Grille -->
    <polygon points="40,138 100,162 160,138" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <line x1="60" y1="138" x2="100" y2="158" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="80" y1="138" x2="100" y2="158" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="120" y1="138" x2="100" y2="158" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="140" y1="138" x2="100" y2="158" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Steam Chimney / Whistle on Top -->
    <rect x="90" y="24" width="20" height="18" rx="2" fill="url(#goldGrad)" stroke="#091b36" stroke-width="2"/>
    <ellipse cx="100" cy="24" rx="14" ry="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Bottom Ribbon / Banner across center bottom: KATIHAR DIVISION -->
  <g transform="translate(126, 335)">
    <!-- Ribbon background -->
    <path d="M 0,15 L 20,0 L 240,0 L 260,15 L 240,30 L 20,30 Z" fill="url(#goldGrad)" stroke="#091b36" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="21" fill="#091b36" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      KATIHAR DIVISION
    </text>
  </g>
</svg>